<body>
  <main id="shell" aria-label="OS Playground">
    <header class="topbar">
      <div class="identity"><span id="brand-icon"></span><strong>Playground</strong><span class="experiment-tag">OS sketch</span></div>
      <nav id="spaces" aria-label="Workspaces"></nav>
      <div class="top-actions">
        <button id="arrange" class="quiet-button" aria-label="Arrange windows"></button>
        <button id="fullscreen" class="icon-button" aria-label="Enter full screen" title="Fill the Spider window"></button>
        <time id="clock"></time>
      </div>
    </header>
    <nav id="rail" class="rail" aria-label="Pinned apps">
      <button id="library" class="rail-button library-button" aria-label="Open playground apps" title="Apps (⌘/Ctrl K)"></button>
      <div class="rail-divider"></div>
      <div id="pinned"></div>
      <div class="rail-spacer"></div>
      <button id="appearance" class="rail-button" aria-label="Open Appearance" title="Appearance"></button>
      <button id="help" class="rail-button" aria-label="Open Start here" title="Start here"></button>
    </nav>
    <section id="desktop" aria-label="Playground desktop" tabindex="0">
      <div class="wallpaper" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit orbit-three"></div><div class="wallpaper-word">room to<br />make things.</div></div>
      <div id="empty" hidden><p>A little breathing room.</p><button id="empty-open">Open an app</button></div>
      <div id="windows"></div>
      <div id="snap-preview" hidden aria-hidden="true"></div>
      <div id="gesture-shield" hidden aria-hidden="true"></div>
    </section>
    <footer class="shelf">
      <button id="show-desktop" class="icon-button" aria-label="Show desktop" title="Show desktop"></button>
      <div class="shelf-divider"></div>
      <nav id="tasks" aria-label="Open windows"></nav>
      <span id="save-status" role="status">Connecting…</span>
    </footer>
  </main>
  <dialog id="app-library" aria-labelledby="library-title">
    <div class="dialog-heading"><h1 id="library-title">Make yourself at home.</h1><button class="icon-button" data-dismiss aria-label="Close apps"></button></div>
    <label class="search-field"><span id="search-icon"></span><input id="app-search" type="search" aria-label="Search playground apps" placeholder="Find an app…" autocomplete="off" /></label>
    <div id="app-results"></div><p class="dialog-hint">⌘ / Ctrl K to open apps <span>Esc to close</span></p>
  </dialog>
  <dialog id="window-menu" aria-labelledby="window-menu-title">
    <div class="dialog-heading"><h2 id="window-menu-title">Window</h2><button class="icon-button" data-dismiss aria-label="Close window actions"></button></div>
    <div id="window-actions"></div>
  </dialog>
  <dialog id="arrange-menu" aria-labelledby="arrange-title">
    <div class="dialog-heading"><h2 id="arrange-title">Arrange this workspace</h2><button class="icon-button" data-dismiss aria-label="Close arrangement options"></button></div>
    <button id="tile" class="action-row">Tile windows <span>See everything together</span></button>
    <button id="cascade" class="action-row">Cascade windows <span>A little overlap, a little room</span></button>
    <p class="dialog-hint">Your writing and ideas stay in place.</p>
  </dialog>
  <div id="notice" role="alert" hidden></div>
