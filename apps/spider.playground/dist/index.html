<body>
  <main id="shell" aria-label="OS Playground">
    <header class="topbar">
      <div class="identity"><span id="brand-icon"></span><strong>Playground</strong><span class="experiment-tag">OS sketch</span></div>
      <div class="top-actions">
        <button id="library" class="icon-button" aria-label="Open playground apps" title="Apps (⌘/Ctrl K)"><span aria-hidden="true">●</span></button>
        <button id="appearance" class="icon-button" aria-label="Open Appearance" title="Appearance"></button>
        <button id="help" class="icon-button" aria-label="Open Start here" title="Start here"></button>
        <button id="arrange" class="quiet-button" aria-label="Arrange windows"></button>
        <button id="fullscreen" class="icon-button" aria-label="Enter full screen" title="Fill the Spider window"></button>
        <time id="clock"></time>
      </div>
    </header>
    <div class="work-heading"><div><p>Independent views. Room to play.</p><h1>Desktop</h1></div><nav id="spaces" aria-label="Workspaces"></nav><button id="search-apps">Search apps <kbd>⌘ K</kbd></button></div>
    <section id="desktop" aria-label="Playground desktop" tabindex="0">
      <canvas id="scenery" aria-hidden="true"></canvas>
      <canvas id="ink-canvas" aria-hidden="true"></canvas>
      <canvas id="live-ink" aria-hidden="true"></canvas>
      <canvas id="crew" aria-hidden="true"></canvas>
      <div id="canvas-surface" aria-hidden="true"></div>
      <div id="empty" hidden><p>A little breathing room.</p><button id="empty-open">Open an app</button></div>
      <div id="world"></div>
      <div id="overlay-windows"></div>
      <div id="gesture-shield" hidden aria-hidden="true"></div>
      <nav class="drawing-tools" aria-label="Drawing tools">
        <button id="pan" aria-label="Pan canvas" aria-pressed="false">Pan</button>
        <button id="draw" aria-label="Draw on canvas" aria-pressed="false">Draw</button>
        <button id="erase" aria-label="Erase drawing" aria-pressed="false">Erase</button>
