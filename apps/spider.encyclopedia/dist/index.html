h2 { margin:0 0 10px; font-size:19px; font-weight:600; }
h3 { font-size:15px; }
p { line-height:1.6; }
.app-header p { margin:0; color:#617880; max-width:70ch; }
.actions, .toolbar { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
button, input, select, textarea { border:1px solid #c8dade; border-radius:7px; background:#fff; padding:9px 12px; }
button:hover:not(:disabled) { background:#edf5f6; }
button.primary { background:#2b6673; border-color:#2b6673; color:#fff; }
button.primary:hover:not(:disabled) { background:#225460; }
textarea { width:100%; resize:vertical; line-height:1.5; }
input[type="checkbox"] { width:17px; height:17px; accent-color:#2b6673; }
label { display:flex; flex-direction:column; gap:6px; font-size:13px; color:#536e77; }
label.check { flex-direction:row; align-items:center; }
#status { margin:18px 0; min-height:22px; font-size:13px; color:#536e77; }
#status.error { color:#a13c3c; }
.muted { color:#657c84; font-size:13px; }
.empty { color:#657c84; padding:45px 20px; text-align:center; }
details { border-top:1px solid #d9e5e8; padding:14px 0; margin-top:16px; }
summary { cursor:pointer; font-size:13px; width:fit-content; }
details form { margin-top:15px; }
.schedule-fields { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin:12px 0; }
.schedule-fields input[type="number"] { width:90px; }
#model { max-width:190px; }
.source-tools { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:14px 0; }
.source-tools button { padding:6px 10px; font-size:12px; }
#source-info { color:#657c84; font-size:12px; }
.two-pane { display:grid; grid-template-columns:240px minmax(0,1fr); gap:24px; border-top:1px solid #d9e5e8; padding-top:18px; }
.item-list { display:flex; flex-direction:column; gap:5px; max-height:510px; overflow-y:auto; }
.item-list button { text-align:left; border-color:transparent; padding:12px; }
.item-list button[aria-current="true"] { background:#eaf4f5; border-color:#b8d4da; }
.item-list strong,.item-list span { display:block; }
.item-list span { font-size:12px; margin-top:6px; color:#657c84; }
.prose { white-space:pre-wrap; line-height:1.7; max-width:76ch; overflow-wrap:anywhere; }
.chips { display:flex; gap:7px; flex-wrap:wrap; }
.chips button { border-radius:18px; padding:6px 11px; font-size:12px; }
.divider { border-top:1px solid #d9e5e8; margin:20px 0; }
@media(max-width:650px) { main{padding:16px}.app-header{flex-direction:column;gap:14px}.two-pane{grid-template-columns:1fr}.item-list{max-height:200px}.schedule-fields{gap:10px}h1{font-size:23px} }

.atlas { display:grid; grid-template-columns:minmax(0,1fr) 285px; margin-top:18px; border:1px solid #d3e3e7; border-radius:10px; overflow:hidden; min-height:450px; }
.map { position:relative; background:#f2f8fa; min-width:0; }
#graph { display:block; width:100%; height:480px; touch-action:pan-y; }
#graph line { stroke:#b4d0d8; stroke-width:1.4; }
#graph circle { fill:#d9ecee; stroke:#79a9b7; stroke-width:1.5; }
#graph g[aria-pressed="true"] circle { fill:#cce7da; stroke:#4e8a70; stroke-width:2.5; }
#graph g { cursor:grab; }
#graph g:focus { outline:none; }
#graph g:focus circle { stroke:#a77845; stroke-width:3; }
#graph text { fill:#264a58; font:14px -apple-system,BlinkMacSystemFont,sans-serif; pointer-events:none; paint-order:stroke; stroke:#f2f8fa; stroke-width:3px; }
.definition { padding:22px; border-left:1px solid #d3e3e7; max-height:520px; overflow-y:auto; }
.definition p { font-size:14px; }
.definition h3 { margin-top:24px; }
.source-link { display:block; text-align:left; border:0; padding:4px 0; color:#356d7b; font-size:12px; overflow-wrap:anywhere; }
#empty { position:absolute; inset:35% 10% auto; pointer-events:none; }
#search { width:270px; max-width:100%; }
dialog { border:1px solid #c8dade; border-radius:10px; width:min(90vw,760px); }
dialog pre { white-space:pre-wrap; overflow-wrap:anywhere; max-height:60vh; overflow:auto; font:12px/1.6 ui-monospace,monospace; }
@media(max-width:800px){.atlas{grid-template-columns:1fr}.definition{border-left:0;border-top:1px solid #d3e3e7;max-height:none}#graph{height:350px}}

  }
  let ticks = 0;
  function settle() {
    for (let i = 0; i < nodes.length; i++) {
      const a = points.get(nodes[i].term.id);
      for (let j = i + 1; j < nodes.length; j++) {
        const b = points.get(nodes[j].term.id);
        let dx = a.x - b.x, dy = a.y - b.y, d = Math.max(15, Math.hypot(dx, dy));
        const force = Math.min(2, 220 / (d * d));
        a.x += dx / d * force;
        b.x -= dx / d * force;
        a.y += dy / d * force;
        b.y -= dy / d * force;
      }
      a.x += (450 - a.x) * 2e-3;
      a.y += (260 - a.y) * 2e-3;
      a.x = Math.max(40, Math.min(860, a.x));
      a.y = Math.max(35, Math.min(475, a.y));
    }
    paint();
    if (++ticks < 80) frame = requestAnimationFrame(settle);
  }
  paint();
  settle();
}
ui.onState((data) => {
  const next = JSON.stringify(data.terms || {});
  if (next !== key) {
    key = next;
    terms = Object.values(data.terms || {}).sort((a, b) => a.label.localeCompare(b.label));
    draw();
    const active = terms.find((t) => t.id === selected);
    if (active) detail(active);
  }
  $("#summary").textContent = data.summary || "";
});
</script></body></html>
