.list-empty { padding: 10px; color: #62777e; }
#more { width: 100%; margin-top: 10px; }
.reader { min-width: 0; padding: 24px 0 16px 28px; }
.empty { max-width: 430px; margin: 70px auto; color: #62777e; }
.empty h2 { color: #203540; }
.conversation-heading button { flex-shrink: 0; background: #2a6573; border-color: #2a6573; color: #fff; }
.conversation-heading button:hover:not(:disabled) { background: #20515d; }
#metadata { font-size: 12px; color: #62777e; margin: 8px 0 0; }
.source-note { color: #526e77; font-size: 13px; margin: 17px 0; }
.messages { max-height: 570px; overflow-y: auto; overscroll-behavior: contain; padding-right: 15px; }
.message { padding: 20px 0; border-top: 1px solid #e0e9eb; }
.message:first-child { padding-top: 8px; border-top: 0; }
.message header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 9px; }
.message strong { font-size: 12px; font-weight: 650; color: #235b67; }
.message time { font-size: 11px; color: #6d8187; }
.message p { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-width: 76ch; line-height: 1.65; }
.message.user { padding-left: 14px; border-left: 3px solid #a8c9d1; }
details { border-top: 1px solid #d9e4e7; margin-top: 24px; padding-top: 15px; font-size: 12px; color: #526e77; }
summary { cursor: pointer; width: fit-content; padding: 3px 0; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f7f8; padding: 14px; border-radius: 6px; max-height: 350px; overflow-y: auto; font: 12px/1.6 ui-monospace, monospace; }
@media (max-width: 650px) {
  main { padding: 16px; }
  .archive { grid-template-columns: 1fr; }
  aside { border-right: 0; padding: 14px 0; border-bottom: 1px solid #d9e4e7; }
  .conversation-list { max-height: 210px; }
  .reader { padding: 20px 0 0; }
  .conversation-heading { flex-direction: column; gap: 10px; }
  .messages { max-height: 520px; }
  .empty { margin: 30px auto; }
  h1 { font-size: 22px; }
  .archive-header { gap: 10px; }
  #refresh { max-width: 130px; }
}

    <main>
      <header class="archive-header">

          <button id="more" type="button" hidden>Load more sources</button>
        </aside>
        <section class="reader" aria-label="Conversation viewer">

          <div id="conversation" hidden>

            <p id="source-note" class="source-note"></p>
            <div id="messages" class="messages"></div>
            <details id="raw" hidden><summary>View saved JSON</summary><pre id="raw-record" tabindex="0"></pre></details>
          </div>
        </section>
      </div>
    </main>
